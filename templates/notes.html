<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Notes</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #eef4ff;
        margin: 0;
        padding: 24px;
      }
      .container {
        max-width: 820px;
        margin: 0 auto;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0;
      }
      .user-tag {
        color: #1f2937;
        background: #dbeafe;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 14px;
      }
      textarea {
        width: 100%;
        min-height: 320px;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        padding: 14px;
        font-size: 16px;
        resize: vertical;
        box-sizing: border-box;
      }
      .actions {
        margin-top: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      button {
        background: #16a34a;
        color: white;
        border: none;
        padding: 12px 18px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
      }
      a {
        text-decoration: none;
        color: #1d4ed8;
      }
      .status {
        color: #166534;
        min-height: 20px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <h1>My Notes</h1>
        <div class="user-tag">{{ user.name }}</div>
      </div>
      <form method="POST" action="/notes">
        <textarea name="note" placeholder="Write your note here...">{{ note }}</textarea>
        <div class="actions">
          <button type="submit">Save Note</button>
          <a href="/logout">Log out</a>
        </div>
      </form>
      <div class="status">
        {% if saved %}Saved successfully.{% endif %}
      </div>
    </div>
  </body>
</html>
